[package]
name = "backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/greeklish/greeklish"
rust-version = "1.94"

[dependencies]
argon2 = "=0.5.3"
axum = { version = "=0.8.8", features = ["json", "macros", "ws"] }
base64 = "=0.22.1"
bytes = "=1.10.1"
dashmap = "=6.1.0"
dotenvy = "=0.15.7"
futures-util = "=0.3.31"
hmac = "=0.12.1"
rand = "=0.9.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
thiserror = "=2.0.18"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.50.0", features = ["full"] }
tokio-util = "=0.7.16"
tower = "=0.5.2"
tower-http = { version = "=0.6.8", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt", "json"] }
ts-rs = "=12.0.1"
unicode-normalization = "=0.1.24"
uuid = { version = "=1.18.1", features = ["serde", "v7"] }
web-push = { version = "=0.11.0", default-features = false }

[dev-dependencies]
ece = "=2.4.2"
