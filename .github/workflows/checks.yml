name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release file names
        run: python3 scripts/check-release.py
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: scripts/scan-secrets.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm --prefix crawl ci --ignore-scripts
      - name: Install crawler test browser
        working-directory: crawl
        run: npx --no-install patchright install --with-deps chromium
      - run: npm --prefix crawl test
      - run: npm --prefix grhyph/js test
      - run: node ui/tests/reply-service-worker.mjs
      - run: npm --prefix ui ci
      - run: npm --prefix ui run check
